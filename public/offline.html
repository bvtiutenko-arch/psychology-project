<!DOCTYPE html>
<html lang="es-PE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estás sin conexión</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c; /* Matches theme_color from manifest */
            color: #e2e8f0; /* Light text for dark background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.1em;
            line-height: 1.5;
            max-width: 600px;
        }
        .icon {
            font-size: 4em;
            margin-bottom: 0.5em;
        }
    </style>
</head>
<body>
    <div class="icon">🌐</div>
    <h1>¡Estás sin conexión!</h1>
    <p>Parece que no tienes conexión a internet. Por favor, verifica tu conexión y vuelve a intentarlo.</p>
    <p>Algunas funciones pueden estar disponibles sin conexión.</p>
</body>
</html>
